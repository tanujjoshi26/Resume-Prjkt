name: Deploy Portfolio
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          # Sync fresh code to portfolio-site (preserve .env on the Pi)
          rsync -a --delete --exclude='.env' $GITHUB_WORKSPACE/ ~/portfolio-site/

          cd ~/portfolio-site

          # Force stop and remove the portfolio container if it exists
          docker stop portfolio 2>/dev/null || true
          docker rm portfolio 2>/dev/null || true

          # Kill anything else still holding port 3000
          fuser -k 3000/tcp 2>/dev/null || true

          # Build and start
          docker compose up -d --build
          echo "Deploy complete"
